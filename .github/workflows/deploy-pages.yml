name: Deploy film + handoff docs to GitHub Pages

on:
  push:
    # Any branch: every branch is a previewable build of the sample scene.
    # The most recent push wins the single Pages site.
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax / import check
        run: npm run check

      - name: Build self-contained film
        run: npm run build

      # The inline bundle must boot: this catches TDZ errors, bad constructor
      # order and a corrupted $& substitution that would ship a blank page.
      - name: Boot smoke test (built bundle)
        run: npm run boot

      # Browsers throw on non-finite canvas arguments where headless canvas
      # silently coerces them, so NaN geometry must be caught in CI.
      - name: Numeric sanity check
        run: npm run finite

      - name: Validate no external assets
        run: |
          if grep -Eq '<script[^>]+src=|<link[^>]+href=|https?://' index.html; then
            echo "index.html must stay fully self-contained"
            exit 1
          fi
          echo "index.html is self-contained ($(wc -c < index.html) bytes)"

      - name: Regenerate deploy docs
        run: npm run docs

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp index.html _site/index.html
          cp README.md _site/README.md
          cp -R docs/. _site/docs/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
