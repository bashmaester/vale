<style>:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050605; }
body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
.screen {

  height: 100vh;

[hidden] { display: none !important; }

/* Optional authoring lab. Invisible during normal playback. */
#lab {

  width: 410px;

.lab-title { font-weight: 700; color: #eef3e8; letter-spacing: .14em; }
.lab-sub { color: #7d9688; font-size: 10px; }

.lab-tab.active { color:#eef3e8; border-bottom-color:#56c7b7; }
.lab-body { overflow:auto; padding: 10px 12px 12px; }
.lab-section { display:none; }
.lab-section.active { display:block; }
.lab-row { display:flex; align-items:center; gap:8px; margin:7px 0; }
.lab-row label { flex: 0 0 118px; color:#9fb2a5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lab-row input[type=range] { flex:1; min-width:0; accent-color:#56c7b7; }
.lab-val { flex:0 0 44px; text-align:right; color:#d7ded4; }
.lab-note { color:#6f8377; line-height:1.5; margin:8px 0; }
.lab-graph { width:100%; height:340px; display:block; border:1px solid #26332c; border-radius:6px; background:#070a08; cursor:grab; }
.lab-graph:active { cursor:grabbing; }
.lab-node-title { font-weight:700; color:#eef3e8; margin:10px 0 4px; }
.lab-check { display:flex; align-items:center; gap:6px; color:#9fb2a5; margin:8px 0; }
.lab-btns { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0; }
.lab-btn { cursor:pointer; border:1px solid #3a4b41; background:#101713; color:#cdd8cb; border-radius:5px; padding:5px 8px; font:inherit; }
.lab-btn:hover { background:#1b2a22; border-color:#56c7b7; }
.lab-btn.primary { border-color:#56c7b7; color:#eef3e8; }
.lab-btn.danger { border-color:#7e3b34; color:#e6b8ae; }
.lab-phasebar { position:relative; height:26px; border:1px solid #26332c; border-radius:5px; overflow:hidden; margin:10px 0 6px; background:#0a0e0b; }
.lab-phase { position:absolute; top:0; bottom:0; font-size:9px; line-height:24px; text-align:center; color:#0a0e0b; font-weight:700; overflow:hidden; white-space:nowrap; }
.lab-cursor { position:absolute; top:0; bottom:0; width:2px; background:#f2ede0; box-shadow:0 0 6px #f2ede0; }
.lab-time { display:flex; justify-content:space-between; color:#9fb2a5; }
.lab-foot { padding:8px 12px; border-top:1px solid #26332c; color:#617569; font-size:10px; line-height:1.5; }
.lab-kbd { color:#cdd8cb; border:1px solid #3a4b41; border-radius:3px; padding:0 4px; }
.lab-textarea { width:100%; height:90px; background:#070a08; color:#9fb2a5; border:1px solid #26332c; border-radius:5px; padding:6px; font:inherit; resize:vertical; }

      <div class="lab-head">
        <div>
          <div class="lab-title">VALE / LOOK LAB</div>
          <div class="lab-sub">3D scene → 2D plate → node shader</div>
        </div>
        <button class="lab-close" title="Close (L)">×</button>
      </div>
      <div class="lab-tabs">
        <button class="lab-tab active" data-tab="look">LOOK</button>
        <button class="lab-tab" data-tab="scene">SCENE</button>
        <button class="lab-tab" data-tab="cam">CAM</button>
        <button class="lab-tab" data-tab="time">TIME</button>
        <button class="lab-tab" data-tab="io">I/O</button>
      </div>
      <div class="lab-body">
        <section class="lab-section active" data-section="look">
          <canvas class="lab-graph" width="380" height="340"></canvas>
          <div class="lab-node-title" id="nodeTitle"></div>
          <div id="nodeParams"></div>
          <div class="lab-note">Drag nodes to rearrange the patch. Double-click a node to bypass it. All changes are live uniforms — no rebuild required.</div>
        </section>
        <section class="lab-section" data-section="scene">
          <div class="lab-note">Parametric scene modules. The crowd, rain, reflections, train and traffic all read from the 20-second signal cycle.</div>
          <div id="sceneParams"></div>
          <div class="lab-node-title">Look presets</div>
          <div class="lab-btns" id="presetBtns"></div>
        </section>
        <section class="lab-section" data-section="cam">
          <div class="lab-note">Take over the 3D camera. The figures, vehicles and umbrellas are procedural 3D geometry projected to outlines, so flying changes their perspective.</div>
          <div class="lab-node-title" id="camStatus">AUTO RIG</div>
          <div class="lab-btns">
            <button class="lab-btn primary" id="camAutoBtn">Auto rig</button>
            <button class="lab-btn" id="camOrbitBtn">Orbit</button>
            <button class="lab-btn" id="camFlyBtn">Fly</button>
            <button class="lab-btn" id="camResetBtn">Reset view</button>
          </div>
          <div id="camParams"></div>
          <div class="lab-note"><b>Drag</b> look · <b>right-drag</b> pan · <b>wheel</b> zoom · <b>WASD/QE</b> fly · <b>Shift</b> boost · <b>C</b> release · <b>F</b> fly/orbit · <b>V</b> reset. Fly speed and easing are also in the SCENE tab.</div>
        </section>
        <section class="lab-section" data-section="time">
          <div class="lab-phasebar" id="phasebar"></div>
          <input type="range" id="scrub" min="0" max="20" step="0.01" value="0" style="width:100%;accent-color:#56c7b7">
          <div class="lab-time"><span id="timeLabel">0.00 / 20.00</span><span id="phaseLabel">WAIT</span></div>
          <div class="lab-btns">
            <button class="lab-btn primary" id="playBtn">Pause</button>
            <button class="lab-btn" id="resetTimeBtn">Rewind</button>
          </div>
          <div class="lab-note">Scrub to inspect the contrast between waiting, crossing, drain and the briefly empty street. Space toggles playback.</div>
        </section>
        <section class="lab-section" data-section="io">
          <div class="lab-btns">
            <button class="lab-btn primary" id="savePngBtn">Save PNG</button>
            <button class="lab-btn" id="copyJsonBtn">Copy JSON</button>
            <button class="lab-btn" id="saveLocalBtn">Save local</button>
            <button class="lab-btn" id="loadLocalBtn">Load local</button>
            <button class="lab-btn danger" id="resetAllBtn">Reset all</button>
          </div>
          <textarea class="lab-textarea" id="jsonBox" spellcheck="false"></textarea>
          <div class="lab-note">The normal film at <b>index.html</b> is UI-free. Append <b>?lab=1</b> to open this patch bay. No external assets, no audio.</div>
        </section>
