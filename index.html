<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VALE — rainy crossing</title>
<style>:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050605; }
body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
.screen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  object-fit: contain;
  background: #050605;
  image-rendering: auto;
}
[hidden] { display: none !important; }

.cam-hud {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 20;
  max-width: min(720px, calc(100vw - 32px));
  padding: 7px 11px;
  color: #d7ded4;
  background: rgba(6, 9, 7, 0.78);
  border: 1px solid rgba(86, 199, 183, 0.45);
  border-radius: 5px;
  font-size: 10px;
  letter-spacing: .04em;
  line-height: 1.5;
  pointer-events: none;
  white-space: normal;
}

/* Optional authoring lab. Invisible during normal playback. */
#lab {
  position: fixed;
  top: 14px;
  right: 14px;
  width: 410px;
  max-height: calc(100vh - 28px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: #d7ded4;
  background: rgba(8, 11, 9, 0.93);
  border: 1px solid #31413a;
  border-radius: 10px;
  box-shadow: 0 18px 60px rgba(0,0,0,.55);
  font-size: 11px;
  letter-spacing: .02em;
  backdrop-filter: blur(8px);
}
.lab-head { display:flex; align-items:center; justify-content:space-between; padding: 10px 12px; border-bottom: 1px solid #26332c; }
.lab-title { font-weight: 700; color: #eef3e8; letter-spacing: .14em; }
.lab-sub { color: #7d9688; font-size: 10px; }
.lab-close { cursor: pointer; border: 1px solid #3a4b41; background: transparent; color: #cdd8cb; border-radius: 4px; padding: 2px 7px; font: inherit; }
.lab-close:hover { background: #1b2a22; }
.lab-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid #26332c; }
.lab-tab { flex:1; cursor:pointer; border:0; background:transparent; color:#7d9688; padding:7px 4px; font:inherit; border-bottom:2px solid transparent; }
.lab-tab.active { color:#eef3e8; border-bottom-color:#56c7b7; }
.lab-body { overflow:auto; padding: 10px 12px 12px; }
.lab-section { display:none; }
.lab-section.active { display:block; }
.lab-row { display:flex; align-items:center; gap:8px; margin:7px 0; }
.lab-row label { flex: 0 0 118px; color:#9fb2a5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lab-row input[type=range] { flex:1; min-width:0; accent-color:#56c7b7; }
.lab-val { flex:0 0 44px; text-align:right; color:#d7ded4; }
.lab-note { color:#6f8377; line-height:1.5; margin:8px 0; }
.lab-graph { width:100%; height:340px; display:block; border:1px solid #26332c; border-radius:6px; background:#070a08; cursor:grab; }
.lab-graph:active { cursor:grabbing; }
.lab-node-title { font-weight:700; color:#eef3e8; margin:10px 0 4px; }
.lab-check { display:flex; align-items:center; gap:6px; color:#9fb2a5; margin:8px 0; }
.lab-btns { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0; }
.lab-btn { cursor:pointer; border:1px solid #3a4b41; background:#101713; color:#cdd8cb; border-radius:5px; padding:5px 8px; font:inherit; }
.lab-btn:hover { background:#1b2a22; border-color:#56c7b7; }
.lab-btn.primary { border-color:#56c7b7; color:#eef3e8; }
.lab-btn.danger { border-color:#7e3b34; color:#e6b8ae; }
.lab-phasebar { position:relative; height:26px; border:1px solid #26332c; border-radius:5px; overflow:hidden; margin:10px 0 6px; background:#0a0e0b; }
.lab-phase { position:absolute; top:0; bottom:0; font-size:9px; line-height:24px; text-align:center; color:#0a0e0b; font-weight:700; overflow:hidden; white-space:nowrap; }
.lab-cursor { position:absolute; top:0; bottom:0; width:2px; background:#f2ede0; box-shadow:0 0 6px #f2ede0; }
.lab-time { display:flex; justify-content:space-between; color:#9fb2a5; }
.lab-foot { padding:8px 12px; border-top:1px solid #26332c; color:#617569; font-size:10px; line-height:1.5; }
.lab-kbd { color:#cdd8cb; border:1px solid #3a4b41; border-radius:3px; padding:0 4px; }
.lab-textarea { width:100%; height:90px; background:#070a08; color:#9fb2a5; border:1px solid #26332c; border-radius:5px; padding:6px; font:inherit; resize:vertical; }

/* --- sidebar: the always-available scene controls ---------------------- */
.sb-handle {
  position: fixed; top: 14px; right: 14px; z-index: 40;
  width: 34px; height: 34px; border-radius: 5px; cursor: pointer;
  border: 1px solid rgba(86,199,183,.45); background: rgba(6,9,7,.78);
  color: #d7ded4; font: 600 15px/1 ui-monospace, monospace;
}
.sb-handle:hover { border-color: #56c7b7; color: #eef3e8; }
.sb {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 39;
  width: min(320px, 92vw); overflow-y: auto; overscroll-behavior: contain;
  padding: 52px 14px 22px;
  background: rgba(6,9,7,.94);
  border-left: 1px solid rgba(86,199,183,.30);
  color: #cdd8cb; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  backdrop-filter: blur(4px);
}
.sb[hidden] { display: none !important; }
.sb-heading { margin: 0 0 4px; font-size: 12px; letter-spacing: .08em; color: #eef3e8; text-transform: uppercase; }
.sb-note { margin: 0 0 14px; color: #6f8377; }
.sb-section { padding: 10px 0 4px; border-top: 1px solid #1d2a23; }
.sb-title { display: flex; align-items: center; justify-content: space-between; width: 100%;
  margin: 0 0 2px; padding: 3px 0; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #56c7b7; }
.sb-title:hover { color: #9fe4d6; }
.sb-chev { color: #4a5f54; font-size: 12px; line-height: 1; letter-spacing: 0; }
.sb-title:hover .sb-chev { color: #56c7b7; }
.sb-section.is-collapsed { padding-bottom: 0; }
.sb-sub { margin: 0 0 6px; color: #6f8377; }
.sb-row { display: block; margin: 8px 0; }
.sb-row-head { display: flex; justify-content: space-between; gap: 8px; color: #9fb2a5; }
.sb-label { color: #9fb2a5; }
.sb-val { color: #d7ded4; font-variant-numeric: tabular-nums; }
.sb-row input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #56c7b7; }
.sb-row select { width: 100%; margin-top: 3px; padding: 4px 6px; border-radius: 4px;
  background: #0b120e; color: #d7ded4; border: 1px solid #2b3a32; font: inherit; }
.sb-row-inline { display: flex; align-items: center; justify-content: space-between; }
.sb-row-inline input[type=checkbox] { accent-color: #56c7b7; width: 15px; height: 15px; }
.sb-btns { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
.sb-btn { cursor: pointer; border: 1px solid #3a4b41; background: #101713; color: #cdd8cb;
  border-radius: 4px; padding: 5px 9px; font: inherit; }
.sb-btn:hover { background: #1b2a22; border-color: #56c7b7; }
</style>
</head>

<script>(()=>{var vs=`#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main(){
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`,ks=`#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;
uniform sampler2D uInk;
uniform sampler2D uField;
uniform vec2 uRes;
uniform float uTime;
`,zs=`
#define PI 3.14159265359
const vec3 PAL_BG   = vec3(0.028, 0.033, 0.029);
const vec3 PAL_INK  = vec3(0.945, 0.922, 0.842);
const vec3 PAL_RED  = vec3(0.835, 0.190, 0.135);
const vec3 PAL_TEAL = vec3(0.105, 0.705, 0.660);
const vec3 PAL_DIM  = vec3(0.330, 0.370, 0.335);

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 345.45));
  p += dot(p, p + 34.345);
  return fract(p.x * p.y);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hash21(i);
  float b = hash21(i+vec2(1.0,0.0));
  float c = hash21(i+vec2(0.0,1.0));
  float d = hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i=0;i<5;i++){ v += a*noise(p); p = p*2.03 + 11.7; a *= 0.5; }
  return v;
}
mat2 rot(float a){ float s=sin(a), c=cos(a); return mat2(c,-s,s,c); }
float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }

vec2 gateWeave(vec2 uv, float t){
  float w = u_source_warp;
  return vec2(
    sin(t*1.7 + uv.y*3.0)*0.00055,
    cos(t*1.31 + uv.x*2.0)*0.00035
  ) * w;
}
`,Ct=n=>Object.fromEntries(Object.entries(n).map(([t,e])=>[t,{type:"float",step:.01,...e}])),js=[{id:"source",name:"01 · Plate / misregister",inputs:[],ui:{x:24,y:22,w:162,h:60},params:Ct({misreg:{value:.85,min:0,max:4,label:"misregister px"},warp:{value:.45,min:0,max:2,label:"gate weave"}}),code:(n,t)=>`vec4 n_source(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  vec2 tx = 1.0/uRes;
  vec2 off = vec2(${n.u(t,"misreg")} * tx.x, 0.0);
  vec4 r = texture(uInk, uv + off);
  vec4 b = texture(uInk, uv - off);
  c.rgb = vec3(r.r, c.g, b.b);
  return c;
}`},{id:"carve",name:"02 · Carve / gouge",inputs:["source"],ui:{x:212,y:22,w:162,h:60},params:Ct({strength:{value:.72,min:0,max:1.5,label:"gouge strength"},scale:{value:13,min:3,max:40,label:"tool size px",step:.5},boil:{value:.3,min:0,max:2,label:"line boil"}}),code:(n,t)=>`vec4 n_carve(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  vec2 tx = 1.0/uRes;
  float l = luma(c.rgb);
  float lx = luma(texture(uInk, uv+vec2(tx.x,0.0)).rgb) - luma(texture(uInk, uv-vec2(tx.x,0.0)).rgb);
  float ly = luma(texture(uInk, uv+vec2(0.0,tx.y)).rgb) - luma(texture(uInk, uv-vec2(0.0,tx.y)).rgb);
  float edge = clamp(length(vec2(lx,ly))*2.3, 0.0, 1.0);
  vec2 gp = uv*uRes/max(${n.u(t,"scale")}, 2.0);
  float n = fbm(gp + vec2(uTime*${n.u(t,"boil")}*2.7, -uTime*${n.u(t,"boil")}*1.6));
  float gouge = smoothstep(0.50, 0.79, n + edge*0.36);
  float crowd = 0.35 + field.g*0.65;
  c.rgb = mix(c.rgb, PAL_INK, gouge*${n.u(t,"strength")}*0.30*crowd);
  c.rgb -= (1.0-gouge)*${n.u(t,"strength")}*0.085*edge;
  float scratch = step(0.986, hash21(floor(uv*uRes/3.0)+floor(uTime*3.0))) * edge;
  c.rgb += scratch*${n.u(t,"strength")}*0.55;
  return c;
}`},{id:"detail",name:"03 · Edge detail",inputs:["carve"],ui:{x:24,y:106,w:162,h:60},params:Ct({contour:{value:.32,min:0,max:1.5,label:"contour cuts"},scale:{value:9,min:3,max:30,label:"contour scale px",step:.5},warp:{value:.7,min:0,max:2,label:"contour warp"},micro:{value:.42,min:0,max:1.5,label:"micro scratches"},spark:{value:.3,min:0,max:1.5,label:"edge sparks"}}),code:(n,t)=>`vec4 n_detail(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  vec2 tx = 1.0/uRes;
  float l = luma(c.rgb);
  float lx = luma(texture(uInk, uv+vec2(tx.x,0.0)).rgb) - luma(texture(uInk, uv-vec2(tx.x,0.0)).rgb);
  float ly = luma(texture(uInk, uv+vec2(0.0,tx.y)).rgb) - luma(texture(uInk, uv-vec2(0.0,tx.y)).rgb);
  vec2 grad = vec2(lx,ly);
  float edge = clamp(length(grad)*2.2, 0.0, 1.0);
  vec2 tang = normalize(vec2(-grad.y, grad.x) + vec2(0.0001));
  vec2 hp = uv*uRes;
  float cc = dot(hp, tang)/max(${n.u(t,"scale")},2.0) + fbm(hp/55.0 + uTime*0.02)*${n.u(t,"warp")};
  float contour = 1.0 - smoothstep(0.30, 0.50, abs(fract(cc)-0.5)*2.0);
  c.rgb += PAL_INK * contour * edge * ${n.u(t,"contour")} * 0.20;
  float micro = step(0.995, hash21(floor(hp/2.0)+floor(uTime*4.0)));
  c.rgb += micro * ${n.u(t,"micro")} * (0.25 + field.g*0.35) * 0.25;
  float spark = step(0.9985, hash21(floor(hp/3.0)+floor(uTime*2.5))) * edge;
  c.rgb += spark * ${n.u(t,"spark")} * 0.5;
  return c;
}`},{id:"hatch",name:"04 · Broken hatch",inputs:["detail"],ui:{x:212,y:106,w:162,h:60},params:Ct({angle:{value:-.62,min:-3.14,max:3.14,label:"hatch angle",step:.01},spacing:{value:7.5,min:3,max:22,label:"spacing px",step:.5},strength:{value:.18,min:0,max:1,label:"hatch strength"},warp:{value:.55,min:0,max:2,label:"angle drift"},jitter:{value:.45,min:0,max:2,label:"line wander"},breakup:{value:.38,min:0,max:1,label:"broken lines"},cross:{value:.22,min:0,max:1,label:"cross hatch"}}),code:(n,t)=>`vec4 n_hatch(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  float l = luma(c.rgb);
  vec2 hp = uv*uRes;
  float n1 = fbm(hp/90.0 + vec2(uTime*0.006,0.0));
  float angle = ${n.u(t,"angle")} + (n1-0.5)*${n.u(t,"warp")} + field.g*0.25;
  float spacing = max(${n.u(t,"spacing")} * (0.72 + 0.55*fbm(hp/140.0+3.7)), 2.0);
  vec2 p = rot(angle)*hp;
  p.x += (fbm(hp/38.0+7.1)-0.5)*${n.u(t,"jitter")}*10.0;
  float f = abs(fract(p.x/spacing)-0.5)*2.0;
  float line = 1.0 - smoothstep(0.28, 0.50, f);
  float breakN = fbm(vec2(p.x/14.0, p.y/9.0)+uTime*0.02);
  line *= smoothstep(0.18, 0.55, breakN - ${n.u(t,"breakup")}*0.25);
  float dark = 1.0 - smoothstep(0.07, 0.62, l);
  float dry = 1.0 - field.r*0.75;
  float amt = dark*${n.u(t,"strength")}*(0.25 + 0.75*dry);
  c.rgb = mix(c.rgb, PAL_INK*0.78, line*amt);
  float angle2 = angle + 1.15;
  vec2 p2 = rot(angle2)*hp;
  p2.x += (fbm(hp/52.0+2.3)-0.5)*${n.u(t,"jitter")}*8.0;
  float f2 = abs(fract(p2.x/(spacing*1.35))-0.5)*2.0;
  float line2 = 1.0 - smoothstep(0.32, 0.50, f2);
  line2 *= smoothstep(0.25, 0.75, dark) * ${n.u(t,"cross")};
  c.rgb = mix(c.rgb, PAL_INK*0.62, line2*amt*0.7);
  return c;
}`},{id:"rain",name:"05 · Puddle mask (plate only)",enabled:!1,inputs:["hatch"],ui:{x:24,y:190,w:162,h:60},params:Ct({intensity:{value:0,min:0,max:1.5,label:"disabled overlay"},speed:{value:0,min:0,max:3,label:"disabled speed"},reflect:{value:0,min:0,max:2,label:"disabled reflection"},splash:{value:0,min:0,max:1.5,label:"disabled splash"}}),code:(n,t)=>`vec4 n_rain(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  // Pass-through: all rain/puddle work happens on the 2D plate.
  return c;
}`},{id:"palette",name:"06 · Ink separation",inputs:["rain"],ui:{x:212,y:190,w:162,h:60},params:Ct({posterize:{value:.88,min:0,max:1,label:"posterize"},bleed:{value:.18,min:0,max:1,label:"ink bleed"},dither:{value:.055,min:0,max:.2,label:"dither",step:.005},accent:{value:.7,min:0,max:2,label:"accent bloom"}}),code:(n,t)=>`vec4 n_palette(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  vec2 tx = 1.0/uRes;
  vec3 blur = (
    texture(uInk, uv+vec2(tx.x*2.0,0.0)).rgb +
    texture(uInk, uv-vec2(tx.x*2.0,0.0)).rgb +
    texture(uInk, uv+vec2(0.0,tx.y*2.0)).rgb +
    texture(uInk, uv-vec2(0.0,tx.y*2.0)).rgb
  )*0.25;
  c.rgb = mix(c.rgb, blur, ${n.u(t,"bleed")});
  c.rgb += (hash21(gl_FragCoord.xy + floor(uTime*3.5))-0.5)*${n.u(t,"dither")};
  vec3 q = c.rgb;
  float best = distance(q, PAL_BG); vec3 col = PAL_BG;
  float d = distance(q, PAL_INK);  if(d<best){best=d; col=PAL_INK;}
  d = distance(q, PAL_RED);       if(d<best){best=d; col=PAL_RED;}
  d = distance(q, PAL_TEAL);      if(d<best){best=d; col=PAL_TEAL;}
  d = distance(q, PAL_DIM);       if(d<best){best=d; col=PAL_DIM;}
  c.rgb = mix(q, col, ${n.u(t,"posterize")});
  c.rgb *= 1.0 + field.b*${n.u(t,"accent")}*0.045;
  return c;
}`},{id:"paper",name:"07 · Paper / grain",inputs:["palette"],ui:{x:24,y:274,w:162,h:60},params:Ct({grain:{value:.085,min:0,max:.3,label:"grain",step:.005},fiber:{value:.03,min:0,max:.25,label:"fiber",step:.005},speckle:{value:.5,min:0,max:1.5,label:"speckle"},vignette:{value:.26,min:0,max:1,label:"vignette"}}),code:(n,t)=>`vec4 n_paper(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  float g = (hash21(gl_FragCoord.xy + vec2(floor(uTime*6.0)))-0.5)*${n.u(t,"grain")};
  float fib = (fbm(uv*uRes/80.0 + uTime*0.01)-0.5)*${n.u(t,"fiber")};
  c.rgb += g + fib;
  float speck = step(0.9982, hash21(floor(gl_FragCoord.xy/2.0)+floor(uTime*3.5)));
  c.rgb = mix(c.rgb, PAL_INK, speck*${n.u(t,"speckle")}*0.7);
  float vig = 1.0 - smoothstep(0.24, 1.06, length((uv-0.5)*vec2(1.0,1.12)));
  c.rgb *= mix(1.0, vig, ${n.u(t,"vignette")});
  float flick = 0.992 + 0.006*sin(uTime*12.0) + 0.004*sin(uTime*4.0);
  c.rgb *= flick;
  return c;
}`},{id:"output",name:"08 · Output",inputs:["paper"],ui:{x:212,y:274,w:162,h:60},params:Ct({exposure:{value:1.02,min:.5,max:1.6,label:"exposure"},contrast:{value:1.12,min:.6,max:1.8,label:"contrast"}}),code:(n,t)=>`vec4 n_output(vec4 c, vec2 uv, vec4 field){
  if(${n.u(t,"enabled")} < 0.5) return c;
  c.rgb = (c.rgb-0.5)*${n.u(t,"contrast")}+0.5;

      <div class="lab-head">
        <div>
          <div class="lab-title">VALE / LOOK LAB</div>

        </div>
        <button class="lab-close" title="Close (L)">×</button>
      </div>
      <div class="lab-tabs">

        <button class="lab-tab" data-tab="time">TIME</button>
        <button class="lab-tab" data-tab="io">I/O</button>
      </div>

          <canvas class="lab-graph" width="380" height="340"></canvas>
          <div class="lab-node-title" id="nodeTitle"></div>

          <div class="lab-btns" id="presetBtns"></div>
